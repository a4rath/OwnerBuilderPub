<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#103b39">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SX Builder">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>SynergeticX Builder</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="SynergeticX Builder home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M5 23 24 8l19 15h-5v18H27V29h-6v12H10V23z"/><path class="windows" d="M19 19h4v4h-4zm7 0h4v4h-4z"/></svg></span>
        <span><strong>SynergeticX Builder</strong><small>OWNER-BUILDER PROJECTS</small></span>
      </a>
      <button id="installBtn" class="install-button" hidden>Install</button>
    </header>
    <main id="app" class="main-content" tabindex="-1"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>Projects</small></button>
      <button data-page="chart" class="nav-item"><span>▥</span><small>Progress</small></button>
      <button data-page="schedule" class="nav-item"><span>☷</span><small>Schedule</small></button>
      <button data-page="data" class="nav-item"><span>⇄</span><small>Data</small></button>
    </nav>
  </div>
  <input id="fileInput" type="file" accept=".json,application/json" multiple hidden>
  <dialog id="taskDialog" class="task-dialog"></dialog>
  <dialog id="confirmDialog" class="confirm-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
